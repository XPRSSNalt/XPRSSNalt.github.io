<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gradient-to-br from-purple-950 via-purple-900 to-indigo-950 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-2xl">
        <!-- Logo/Title -->
        <div class="text-center mb-8">
            <h1 class="text-6xl font-bold text-purple-100 mb-2">Search</h1>
            <p class="text-purple-300">Vibecoded by XPRSSN</p>
        </div>

        <!-- Search Form -->
        <form action="https://www.google.com/search" method="get" target="_blank" class="mb-6">
            <div class="flex gap-3">
                <input 
                    type="text" 
                    name="q" 
                    placeholder="Search the web..." 
                    required
                    class="flex-1 px-6 py-4 text-lg rounded-full border-2 border-purple-600 bg-purple-900/50 text-purple-100 placeholder-purple-400 focus:border-purple-400 focus:outline-none shadow-lg focus:bg-purple-900/70"
                    autocomplete="off"
                >
                <button 
                    type="submit"
                    class="px-8 py-4 bg-purple-600 text-white font-semibold rounded-full hover:bg-purple-500 transition-colors shadow-lg"
                >
                    Search
                </button>
            </div>
        </form>

        <!-- Quick Links -->
        <div class="text-center">
            <p class="text-sm text-purple-300 mb-3">Quick links:</p>
            <div class="flex justify-center gap-4 flex-wrap">
                <a href="https://www.youtube.com" target="_blank" class="text-blue-600 hover:underline">YouTube</a>
                <a href="https://memesense.gg" target="_blank" class="text-blue-600 hover:underline">Memesense</a>
                <a href="https://elearning.auth.gr/" target="_blank" class="text-blue-600 hover:underline">eLearning</a>
                <a href="https://gemini.google.com/" target="_blank" class="text-blue-600 hover:underline">Gemini</a>
                <a href="https://www.auth.gr/weekly-menu/" target="_blank" class="text-blue-600 hover:underline">Menu</a>
            </div>
        </div>
    </div>

    <script>
        // Auto-focus on the search input when page loads
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelector('input[name="q"]').focus();
        });

        // Optional: Add Enter key support (already works with form submit)
        document.querySelector('input[name="q"]').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.target.form.submit();
            }
        });
    </script>
</body>
</html>
